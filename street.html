<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Street — RMGL Portfolio</title>
<meta name="description" content="RMGL Portfolio — photography by Ryan Lothian. London.">
<meta name="theme-color" content="#111110">
<style>
  :root{--bg:#111110;--bg-2:#191917;--line:#2b2b28;--ink:#f4f1ea;--ink-dim:#a29d95;--accent:#e8c547}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased;
    padding-bottom:calc(40px + env(safe-area-inset-bottom))}
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%}
  .wrap{max-width:1100px;margin:0 auto;padding:0 18px}
  header{padding:34px 0 22px;text-align:center}
  header h1{font-size:1.6rem;font-weight:700;letter-spacing:-0.02em}
  header p{margin-top:7px;color:var(--ink-dim);font-size:0.98rem}
  nav.cats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
  nav.cats a{padding:9px 15px;border:1px solid var(--line);border-radius:999px;
    font-size:0.9rem;font-weight:600;background:var(--bg-2)}
  nav.cats a[aria-current]{background:var(--accent);color:#141400;border-color:var(--accent)}
  h2.sec{font-size:1.25rem;margin:30px 0 14px;letter-spacing:-0.02em}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  @media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:920px){.grid{grid-template-columns:repeat(4,1fr)}}
  .grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;
    background:var(--bg-2);cursor:zoom-in}
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px}
  @media(min-width:760px){.cards{grid-template-columns:repeat(4,1fr)}}
  .card{position:relative;border-radius:12px;overflow:hidden;background:var(--bg-2);
    border:1px solid var(--line)}
  .card img{width:100%;aspect-ratio:3/4;object-fit:cover}
  .card span{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 11px;
    font-weight:650;font-size:1rem;
    background:linear-gradient(to top,rgba(10,10,9,.88),transparent)}
  footer{margin-top:44px;padding:26px 0;text-align:center;color:var(--ink-dim);
    font-size:0.85rem;border-top:1px solid var(--line)}
  footer a{border-bottom:1px solid var(--line)}
  /* lightbox */
  #lb{position:fixed;inset:0;background:rgba(9,9,8,.97);display:none;
    align-items:center;justify-content:center;z-index:99;padding:14px}
  #lb.on{display:flex}
  #lb img{max-width:100%;max-height:92vh;object-fit:contain;border-radius:4px}
  #lb button{position:absolute;background:none;border:0;color:var(--ink);
    font-size:2.4rem;line-height:1;cursor:pointer;padding:14px;
    -webkit-tap-highlight-color:transparent}
  #lbx{top:calc(6px + env(safe-area-inset-top));right:6px}
  #lbp{left:2px;top:50%;transform:translateY(-50%)}
  #lbn{right:2px;top:50%;transform:translateY(-50%)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="wrap">
  <h1>RMGL Portfolio</h1>
  <p>Photography &middot; London</p>
  <nav class="cats">
<a href="index.html">All</a>
<a href="portraits.html">Portraits</a>
<a href="skating.html">Skating</a>
<a href="landscape.html">Landscape</a>
<a href="street.html" aria-current="page">Street</a>
</nav>
</header>
<main class="wrap">
<h2 class="sec">Street <span style="color:var(--ink-dim);font-weight:400">&middot; 2</span></h2>
<div class="grid">
<img src="thumbs/street-01.jpg" data-full="img/street-01.jpg" loading="lazy" alt="">
<img src="thumbs/street-02.jpg" data-full="img/street-02.jpg" loading="lazy" alt="">
</div>
</main>
<footer><div class="wrap">RMGL Media &middot; Roaming Media Group London<br><a href="https://instagram.com/gg.zip" target="_blank" rel="noopener">@gg.zip</a> &middot; <a href="https://dreadpirateduppie.github.io/gg-zip/">Prints &amp; prices</a></div></footer>
<div id="lb"><button id="lbx" aria-label="Close">&times;</button>
<button id="lbp" aria-label="Previous">&lsaquo;</button>
<img id="lbi" alt="">
<button id="lbn" aria-label="Next">&rsaquo;</button></div>
<script>
(function(){
  var g=[].slice.call(document.querySelectorAll('.grid img'));
  if(!g.length)return;
  var lb=document.getElementById('lb'),im=document.getElementById('lbi'),i=0;
  function show(n){i=(n+g.length)%g.length;im.src=g[i].dataset.full;lb.classList.add('on');
    document.body.style.overflow='hidden';}
  function hide(){lb.classList.remove('on');im.src='';document.body.style.overflow='';}
  g.forEach(function(el,n){el.addEventListener('click',function(){show(n)})});
  document.getElementById('lbx').onclick=hide;
  document.getElementById('lbp').onclick=function(e){e.stopPropagation();show(i-1)};
  document.getElementById('lbn').onclick=function(e){e.stopPropagation();show(i+1)};
  lb.addEventListener('click',function(e){if(e.target===lb)hide()});
  document.addEventListener('keydown',function(e){
    if(!lb.classList.contains('on'))return;
    if(e.key==='Escape')hide();
    if(e.key==='ArrowLeft')show(i-1);
    if(e.key==='ArrowRight')show(i+1);
  });
})();
</script>
</body>
</html>
