<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Landscape — RMGL</title>
<meta name="description" content="RMGL Media — photography.">
<meta name="theme-color" content="#0b0b0b">
<style>
  :root{
    --bg:#0b0b0b;
    --ink:#ededea;
    --dim:#8f8e89;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(70px + env(safe-area-inset-bottom));
  }
  a{color:inherit;text-decoration:none}
  img{display:block;width:100%;height:auto}

  /* ---- masthead: quiet, gets out of the way ---- */
  header{padding:44px 20px 30px;text-align:center}
  .mark{
    font-size:0.95rem;letter-spacing:0.1em;text-transform:uppercase;
    font-weight:500;
  }
  .sub{
    margin-top:9px;font-size:0.88rem;letter-spacing:0.1em;
    text-transform:uppercase;color:var(--dim);line-height:1.7;
  }
  nav{
    display:flex;gap:22px;justify-content:center;flex-wrap:wrap;
    margin-top:26px;
  }
  nav a{
    font-size:0.88rem;letter-spacing:0.1em;text-transform:uppercase;
    color:var(--dim);padding-bottom:3px;
  }
  nav a[aria-current]{color:var(--ink);box-shadow:0 1px 0 var(--ink)}

  /* ---- the work: one column, native ratios, room to breathe ---- */
  .shots{
    max-width:940px;margin:0 auto;
    display:flex;flex-direction:column;
    gap:14vw;
    padding:6vw 0 0;
  }
  @media(min-width:780px){ .shots{gap:110px;padding-top:40px} }

  .shots img{
    cursor:zoom-in;
    background:#141413;
  }

  footer{
    margin-top:16vw;padding:34px 20px;text-align:center;
    font-size:0.86rem;letter-spacing:0.1em;text-transform:uppercase;
    color:var(--dim);
  }
  footer a{color:var(--dim)}
  footer a:hover{color:var(--ink)}
  footer .r{margin-top:10px;letter-spacing:0.1em;text-transform:none;font-size:0.9rem}

  /* ---- lightbox ---- */
  #lb{position:fixed;inset:0;background:#070707;display:none;
    align-items:center;justify-content:center;z-index:99}
  #lb.on{display:flex}
  #lb img{max-width:100%;max-height:100vh;width:auto;object-fit:contain;cursor:zoom-out}
  #lb button{position:absolute;background:none;border:0;color:#c9c9c5;
    font-size:2rem;line-height:1;cursor:pointer;padding:18px;
    -webkit-tap-highlight-color:transparent}
  #lb button:hover{color:#fff}
  #lbx{top:calc(4px + env(safe-area-inset-top));right:6px;font-size:2.2rem}
  #lbp{left:0;top:50%;transform:translateY(-50%)}
  #lbn{right:0;top:50%;transform:translateY(-50%)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="mark">RMGL</div>
  <div class="sub">Photography &middot; London</div>
  <nav>
  <a href="index.html">Home</a>
  <a href="portraits.html">Portraits</a>
  <a href="skating.html">Skating</a>
  <a href="landscape.html" aria-current="page">Landscape</a>
  <a href="street.html">Street</a>
  </nav>
</header>
<main>
<div class="shots">
  <img src="display/landscape-01.jpg" data-full="img/landscape-01.jpg" width="1500" height="993" alt="">
  <img src="display/landscape-02.jpg" data-full="img/landscape-02.jpg" width="1500" height="999" alt="">
  <img src="display/landscape-03.jpg" data-full="img/landscape-03.jpg" width="1500" height="993" loading="lazy" alt="">
  <img src="display/landscape-04.jpg" data-full="img/landscape-04.jpg" width="1500" height="993" loading="lazy" alt="">
  <img src="display/landscape-05.jpg" data-full="img/landscape-05.jpg" width="1500" height="993" loading="lazy" alt="">
  <img src="display/landscape-06.jpg" data-full="img/landscape-06.jpg" width="1500" height="993" loading="lazy" alt="">
  <img src="display/landscape-07.jpg" data-full="img/landscape-07.jpg" width="1500" height="999" loading="lazy" alt="">
  <img src="display/landscape-08.jpg" data-full="img/landscape-08.jpg" width="1500" height="993" loading="lazy" alt="">
  <img src="display/landscape-09.jpg" data-full="img/landscape-09.jpg" width="1500" height="993" loading="lazy" alt="">
</div>
</main>
<footer><a href="https://instagram.com/gg.zip" target="_blank" rel="noopener">@gg.zip</a>&nbsp;&nbsp;&middot;&nbsp;&nbsp;<a href="https://dreadpirateduppie.github.io/gg-zip/">Prints</a><div class="r">Roaming Media Group London</div></footer>
<div id="lb"><button id="lbx" aria-label="Close">&times;</button><button id="lbp" aria-label="Previous">&lsaquo;</button><img id="lbi" alt=""><button id="lbn" aria-label="Next">&rsaquo;</button></div>
<script>
(function(){
  var g=[].slice.call(document.querySelectorAll('.shots img'));
  if(!g.length)return;
  var lb=document.getElementById('lb'),im=document.getElementById('lbi'),i=0;
  function show(n){i=(n+g.length)%g.length;im.src=g[i].dataset.full;
    lb.classList.add('on');document.body.style.overflow='hidden';}
  function hide(){lb.classList.remove('on');im.src='';document.body.style.overflow='';}
  g.forEach(function(el,n){el.addEventListener('click',function(){show(n)})});
  document.getElementById('lbx').onclick=hide;
  im.onclick=hide;
  document.getElementById('lbp').onclick=function(e){e.stopPropagation();show(i-1)};
  document.getElementById('lbn').onclick=function(e){e.stopPropagation();show(i+1)};
  lb.addEventListener('click',function(e){if(e.target===lb)hide()});
  document.addEventListener('keydown',function(e){
    if(!lb.classList.contains('on'))return;
    if(e.key==='Escape')hide();
    if(e.key==='ArrowLeft')show(i-1);
    if(e.key==='ArrowRight')show(i+1);
  });
})();
</script>
</body>
</html>
