<style>
  :root{
    --bg:#0a0a09;
    --ink:#f0efec;
    --dim:#787772;
    --line:#1d1d1b;
    --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  img{display:block;width:100%;height:auto}

  .eyebrow{font-size:0.63rem;letter-spacing:0.34em;text-transform:uppercase;color:var(--dim)}

  /* reveal on scroll */
  .rv{opacity:0;transform:translateY(26px);
    transition:opacity 1.1s cubic-bezier(.16,.7,.28,1),transform 1.1s cubic-bezier(.16,.7,.28,1)}
  .rv.in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){
    .rv{opacity:1!important;transform:none!important;transition:none!important}
    *{animation:none!important}
  }

  footer{padding:80px 20px calc(56px + env(safe-area-inset-bottom));text-align:center;
    border-top:1px solid var(--line);margin-top:8vw}
  .fmark{font-family:var(--serif);font-size:2rem;letter-spacing:0.2em;text-indent:0.2em}
  .flinks{margin-top:22px;display:flex;gap:26px;justify-content:center;flex-wrap:wrap}
  .flinks a{font-size:0.68rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--dim)}
  .flinks a:hover{color:var(--ink)}
  .fr{margin-top:26px;font-size:0.72rem;color:#4d4d49}

  #lb{position:fixed;inset:0;background:#060605;display:none;align-items:center;
    justify-content:center;z-index:99}
  #lb.on{display:flex}
  #lb img{max-width:100%;max-height:100vh;width:auto;object-fit:contain;cursor:zoom-out}
  #lb button{position:absolute;background:none;border:0;color:#b6b6b1;font-size:2rem;
    line-height:1;cursor:pointer;padding:18px;-webkit-tap-highlight-color:transparent}
  #lb button:hover{color:#fff}
  #lbx{top:calc(4px + env(safe-area-inset-top));right:6px;font-size:2.2rem}
  #lbp{left:0;top:50%;transform:translateY(-50%)}
  #lbn{right:0;top:50%;transform:translateY(-50%)}

  header{padding:52px 20px 8px;text-align:center}
  header .t{font-family:var(--serif);font-weight:400;font-size:clamp(2.4rem,9vw,3.6rem);
    line-height:1;letter-spacing:.02em}
  header .c{margin-top:14px;font-size:0.62rem;letter-spacing:0.28em;
    text-transform:uppercase;color:var(--dim)}
  nav.bar{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;
    margin-top:30px;padding-bottom:8px}
  nav.bar a{font-size:0.64rem;letter-spacing:0.2em;text-transform:uppercase;
    color:var(--dim);padding-bottom:4px}
  nav.bar a[aria-current]{color:var(--ink);box-shadow:0 1px 0 var(--ink)}

  .flow{max-width:1180px;margin:0 auto;padding:9vw 0 0;
    display:flex;flex-direction:column;gap:13vw}
  @media(min-width:780px){.flow{gap:130px;padding-top:60px}}

  .full{width:100%}
  .inset{max-width:900px;margin:0 auto;padding:0 min(7vw,60px)}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;
    max-width:1120px;margin:0 auto;padding:0 min(4vw,26px)}
  @media(max-width:520px){.pair{gap:7px;padding:0 10px}}
  .flow img{cursor:zoom-in;background:#141413}
</style>
</head>

<div id="lb"><button id="lbx" aria-label="Close">&times;</button><button id="lbp" aria-label="Previous">&lsaquo;</button><img id="lbi" alt=""><button id="lbn" aria-label="Next">&rsaquo;</button></div>
<script>
(function(){
  var els=[].slice.call(document.querySelectorAll('.rv'));
  if(!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('in')});return;}
  var io=new IntersectionObserver(function(en){
    en.forEach(function(e){ if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);} });
  },{rootMargin:'0px 0px -8% 0px',threshold:0.04});
  els.forEach(function(e){io.observe(e)});
})();

(function(){
  var g=[].slice.call(document.querySelectorAll('[data-full]'));
  if(!g.length)return;
  var lb=document.getElementById('lb'),im=document.getElementById('lbi'),i=0;
  function show(n){i=(n+g.length)%g.length;im.src=g[i].dataset.full;
    lb.classList.add('on');document.body.style.overflow='hidden';}
  function hide(){lb.classList.remove('on');im.src='';document.body.style.overflow='';}
  g.forEach(function(el,n){el.addEventListener('click',function(){show(n)})});
  document.getElementById('lbx').onclick=hide; im.onclick=hide;
  document.getElementById('lbp').onclick=function(e){e.stopPropagation();show(i-1)};
  document.getElementById('lbn').onclick=function(e){e.stopPropagation();show(i+1)};
  lb.addEventListener('click',function(e){if(e.target===lb)hide()});
  document.addEventListener('keydown',function(e){
    if(!lb.classList.contains('on'))return;
    if(e.key==='Escape')hide(); if(e.key==='ArrowLeft')show(i-1); if(e.key==='ArrowRight')show(i+1);
  });
})();
</script>
