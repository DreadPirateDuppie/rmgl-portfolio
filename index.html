<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RMGL — Photography</title>
<meta name="description" content="RMGL Portfolio — photography by Ryan Lothian. Portraits, skating, landscape and street. London.">
<meta name="theme-color" content="#0b0b0b">
<meta property="og:title" content="RMGL — Photography">
<meta property="og:image" content="display/portraits-01.jpg">
<style>
  :root{--bg:#0b0b0b;--ink:#ededea;--dim:#6f6f6b}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  img{display:block;width:100%;height:auto}

  /* ---- full-height opening frame ---- */
  .hero{position:relative;height:100svh;min-height:520px;overflow:hidden}
  .hero img{width:100%;height:100%;object-fit:cover;object-position:center 32%}
  .hero::after{content:"";position:absolute;inset:0;
    background:linear-gradient(to bottom,rgba(8,8,8,.55) 0%,rgba(8,8,8,.12) 34%,
      rgba(8,8,8,.16) 62%,rgba(8,8,8,.9) 100%)}
  .hero .over{position:absolute;inset:0;z-index:2;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px}
  .hero .mark{font-size:clamp(1.5rem,7vw,2.6rem);letter-spacing:0.42em;
    font-weight:400;text-indent:0.42em}
  .hero .sub{margin-top:16px;font-size:0.7rem;letter-spacing:0.3em;
    text-transform:uppercase;color:#cfcfca}
  .scroll{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom));
    left:0;right:0;z-index:2;text-align:center;
    font-size:0.62rem;letter-spacing:0.28em;text-transform:uppercase;color:#b9b9b4}

  /* ---- category doors ---- */
  .doors{display:flex;flex-direction:column}
  .door{position:relative;display:block;overflow:hidden;
    height:62svh;min-height:340px}
  @media(min-width:900px){
    .doors{flex-direction:row;flex-wrap:wrap}
    .door{width:50%;height:56svh}
  }
  .door img{width:100%;height:100%;object-fit:cover;
    transition:transform .7s cubic-bezier(.2,.7,.3,1)}
  .door:hover img{transform:scale(1.04)}
  .door::after{content:"";position:absolute;inset:0;
    background:linear-gradient(to top,rgba(8,8,8,.82) 0%,rgba(8,8,8,.05) 55%)}
  .door .lab{position:absolute;left:0;right:0;bottom:0;z-index:2;
    padding:0 0 30px;text-align:center;
    font-size:0.74rem;letter-spacing:0.3em;text-transform:uppercase}
  .door .n{display:block;margin-top:7px;font-size:0.62rem;
    letter-spacing:0.2em;color:#a8a8a3}

  .allrow{padding:52px 20px;text-align:center}
  .allrow a{font-size:0.72rem;letter-spacing:0.26em;text-transform:uppercase;
    color:var(--dim);padding-bottom:4px;box-shadow:0 1px 0 #333}
  .allrow a:hover{color:var(--ink);box-shadow:0 1px 0 var(--ink)}

  footer{padding:34px 20px calc(44px + env(safe-area-inset-bottom));text-align:center;
    font-size:0.7rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--dim);
    border-top:1px solid #1c1c1a}
  footer a{color:var(--dim)}
  footer a:hover{color:var(--ink)}
  footer .r{margin-top:10px;letter-spacing:0.1em;text-transform:none;font-size:0.75rem}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section class="hero">
  <img src="display/portraits-01.jpg" width="993" height="1500" alt="">
  <div class="over">
    <div class="mark">RMGL</div>
    <div class="sub">Photography &middot; London</div>
  </div>
  <div class="scroll">Scroll</div>
</section>

<nav class="doors">
  <a class="door" href="portraits.html">
    <img src="display/portraits-21.jpg" loading="lazy" alt="">
    <span class="lab">Portraits<span class="n">21 photographs</span></span>
  </a>
  <a class="door" href="skating.html">
    <img src="display/skating-01.jpg" loading="lazy" alt="">
    <span class="lab">Skating<span class="n">12 photographs</span></span>
  </a>
  <a class="door" href="landscape.html">
    <img src="display/landscape-01.jpg" loading="lazy" alt="">
    <span class="lab">Landscape<span class="n">9 photographs</span></span>
  </a>
  <a class="door" href="street.html">
    <img src="display/street-01.jpg" loading="lazy" alt="">
    <span class="lab">Street<span class="n">2 photographs</span></span>
  </a>
</nav>

<div class="allrow"><a href="all.html">View everything</a></div>

<footer>
  <a href="https://instagram.com/gg.zip" target="_blank" rel="noopener">@gg.zip</a>
  &nbsp;&nbsp;&middot;&nbsp;&nbsp;
  <a href="https://dreadpirateduppie.github.io/gg-zip/">Prints</a>
  <div class="r">Roaming Media Group London</div>
</footer>

</body>
</html>
